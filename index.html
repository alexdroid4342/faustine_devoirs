<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le nombre du jour — Faustine</title>
<meta name="theme-color" content="#F0EEE6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nombre du jour">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#F0EEE6; --ink:#2B2026; --muted:#5E525A;
  --rose:#E0117A; --roseL:#A61A58; --vio:#6F43C4; --onRose:#FFF8FC;
  --p1:#FFE1F0; --p2:#EDE3FF; --p3:#D9F2E6; --p4:#FFF0CC;
  --line:#DDD8CC; --card:#FFFFFF; --glow:#F3C9DF; --ok:#2E7D4F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper);min-height:100%}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
  font-family:'Andika','Trebuchet MS',sans-serif;font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 60px}

.crown{background:linear-gradient(140deg,var(--p1),var(--p2) 55%,var(--p4));
  border:3px solid var(--line);border-radius:26px;padding:16px 14px;text-align:center;box-shadow:0 6px 0 var(--glow)}
h1{font-family:'Fredoka','Trebuchet MS',sans-serif;font-weight:600;font-size:24px;margin:0;color:var(--roseL);
  display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;line-height:1.2}
h1 .uni{font-size:30px}
.sub{color:var(--muted);font-size:14px;margin-top:3px}

.bar{display:flex;align-items:center;gap:10px;margin:18px 0 6px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex:1}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--rose)}
.dot.now{background:var(--vio);transform:scale(1.3)}
.step{font-size:14px;color:var(--muted)}

.numcard{background:linear-gradient(140deg,var(--p1),var(--p2));border:3px solid var(--line);
  border-radius:24px;text-align:center;padding:14px;margin-top:10px}
.numcard .lab{font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--vio);font-family:'Fredoka',sans-serif;font-weight:600}
.numcard .n{font-size:72px;font-weight:700;line-height:1.05;color:var(--roseL)}

h2{font-family:'Fredoka','Trebuchet MS',sans-serif;font-weight:600;font-size:22px;margin:22px 0 2px;color:var(--roseL)}
.hint{color:var(--vio);font-size:16px;margin:4px 0 14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{font-family:inherit;cursor:pointer}
.act{font-size:17px;padding:13px 20px;border-radius:14px;border:2px solid var(--rose);
  background:var(--rose);color:var(--onRose);font-weight:700}
.ghost{border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:400}
.big{font-size:20px;padding:16px 26px}

.opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.center{text-align:center}
.line3{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:6px}
.numbox{display:flex;align-items:center;justify-content:center;min-width:94px;height:84px;
  border:3px solid var(--line);border-radius:16px;background:var(--card);font-size:38px;font-weight:700}
.numbox.now{border-color:var(--rose)}
.numbox.q{background:var(--card);border-style:dashed;color:var(--vio)}
.numbox.set{border-style:solid;border-color:var(--ok);background:var(--p3);color:var(--ok)}
.cmp{font-size:34px;font-weight:700;color:var(--vio);min-width:40px;text-align:center}
.opt{font-size:30px;font-weight:700;min-width:84px;padding:14px 10px;border-radius:14px;
  border:3px solid var(--line);background:var(--card);color:var(--ink)}
.opt.good{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--rose);border-color:var(--rose);color:var(--onRose)}
.opt:disabled{opacity:.55}
.sm{font-size:22px;min-width:56px;padding:11px 6px}

.q{font-size:26px;margin-top:4px;text-align:center}
.sep{height:2px;background:var(--line);margin:18px 0}

/* matériel base 10 */
.mat{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;min-height:120px;
  background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.bars,.cubes{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}
.barre{width:20px;height:110px;border:2px solid var(--roseL);border-radius:4px;
  background:repeating-linear-gradient(to bottom,var(--p1) 0 9px,var(--roseL) 9px 10px)}
.cube{width:20px;height:20px;border:2px solid var(--vio);border-radius:4px;background:var(--p2)}
.ctrls{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.ctrls button{font-size:17px;padding:14px 8px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.icbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:62px}
.icbtn .sign{font-size:30px;font-weight:700;color:var(--roseL);line-height:1}
.mini-barre{width:14px;height:40px;border:2px solid var(--roseL);border-radius:3px;
  background:repeating-linear-gradient(to bottom,var(--p1) 0 3px,var(--roseL) 3px 4px)}
.mini-cube{width:22px;height:22px;border:2px solid var(--vio);border-radius:4px;background:var(--p2)}
.cnt{font-size:19px;margin-top:10px;color:var(--muted);text-align:center}

/* tableau de numération */
.tn{display:flex;gap:10px;justify-content:center;margin-top:8px}
.tncol{flex:1;max-width:150px;text-align:center}
.tnhead{font-family:'Fredoka',sans-serif;font-weight:600;font-size:26px;
  color:var(--muted);background:#E8E4D9;border-radius:10px;padding:5px 2px}
.tnval{height:76px;border:3px dashed var(--line);border-radius:12px;margin-top:8px;
  display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;background:var(--card)}
.tnval.set{border-style:solid;border-color:var(--ok);color:var(--ok)}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.pad button{font-size:24px;font-weight:700;padding:12px 0;border-radius:12px;border:3px solid var(--line);background:var(--card);color:var(--ink)}

/* ordonner */
.ordpool{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:center}
.ordpool button{font-size:32px;font-weight:700;min-width:92px;padding:16px 10px;border-radius:16px;
  border:3px solid var(--line);background:var(--card);color:var(--ink)}
.ordpool button.taken{background:var(--ok);border-color:var(--ok);color:#fff}
.ordpool button.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ends{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;
  font-family:'Fredoka',sans-serif;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--vio)}
.ends .s{font-size:12px}
.ends .g{font-size:17px}
.schema{display:flex;align-items:center;gap:5px}
.slot{flex:1;min-width:0;height:66px;border:3px dashed var(--line);border-radius:12px;background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:700}
.slot.set{border-style:solid;border-color:var(--ok);background:var(--p3);color:var(--ok)}
.arrow{flex:0 0 auto;font-size:19px;color:var(--vio)}

.pairs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.pairs button{font-size:30px;font-weight:700;padding:18px 4px;border-radius:14px;
  border:3px solid var(--line);background:var(--card);color:var(--ink)}
.pairs button.sel{border-color:var(--vio);background:var(--vio);color:#fff}
.pairs button.taken{background:var(--ok);border-color:var(--ok);color:#fff}
.pairs button.shake{animation:sh .3s}
.found{margin-top:14px;display:flex;flex-direction:column;gap:6px;align-items:center}
.found span{font-size:22px;font-weight:700;color:var(--ok);background:var(--p3);border-radius:10px;padding:5px 14px}

.done{background:var(--p3);border:2px solid var(--ok);border-radius:18px;padding:16px;margin-top:16px;font-size:19px}
.done b{color:var(--ok)}
.final{text-align:center;padding:26px 16px}
.final .stars{font-size:40px;letter-spacing:6px}
footer{color:var(--muted);font-size:13px;text-align:center;padding:20px 16px}
</style>
</head>
<body>
<div class="wrap">

  <div class="crown">
    <h1><span class="uni">🦄</span> Le nombre du jour <span class="uni">🦄</span></h1>
    <div class="sub">Faustine — CP</div>
  </div>

  <div id="start">
    <div class="numcard" style="margin-top:18px">
      <div class="lab">Prête ?</div>
      <div class="n">?</div>
    </div>
    <p class="hint" style="text-align:center;margin-top:14px">6 ateliers sur un même nombre, entre 0 et 100.</p>
    <div class="row" style="justify-content:center"><button class="act big" id="go">Tirer mon nombre</button></div>
  </div>

  <div id="play" hidden>
    <div class="bar">
      <div class="dots" id="dots"></div>
      <div class="step" id="step"></div>
    </div>
    <div class="numcard">
      <div class="lab">Le nombre du jour</div>
      <div class="n" id="bigN">42</div>
    </div>
    <div id="atelier"></div>
  </div>

  <div id="end" hidden class="final">
    <div class="stars" id="stars"></div>
    <h2 style="justify-content:center">Bravo Faustine !</h2>
    <p class="hint">Les 6 ateliers sont terminés.</p>
    <div class="row" style="justify-content:center"><button class="act big" id="again">Un nouveau nombre</button></div>
  </div>

</div>
<footer>Le nombre du jour — routine mathématique maison.</footer>

<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  function el(t,c,txt){ var e=document.createElement(t); if(c) e.className=c; if(txt!=null) e.textContent=txt; return e; }
  function rnd(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
  function uniqOpts(good, maker, k){
    var s=[good]; var guard=0;
    while(s.length<k && guard++<200){ var v=maker(); if(v!=null && s.indexOf(v)===-1) s.push(v); }
    return shuffle(s);
  }

  var N = 0, ORDER = [], IDX = 0;

  /* ---------- briques ---------- */
  function qcm(host, question, good, options, onOk, size){
    var wrap = el("div","card");
    wrap.appendChild(el("div","q",question));
    var box = el("div","opts");
    options.forEach(function(v){
      var b = el("button", size==="sm" ? "opt sm" : "opt", String(v));
      b.addEventListener("click", function(){
        if(wrap.dataset.lock) return;
        if(v === good){
          wrap.dataset.lock = "1";
          b.classList.add("good");
          [].forEach.call(box.children, function(x){ x.disabled = true; });
          setTimeout(onOk, 450);
        } else {
          b.classList.add("bad"); b.disabled = true;
        }
      });
      box.appendChild(b);
    });
    wrap.appendChild(box);
    host.appendChild(wrap);
  }

  function serie(host, items, done){
    var i = 0;
    function next(){
      if(i >= items.length){ done(); return; }
      items[i++](host, next);
    }
    next();
  }

  function finish(host){
    var d = el("div","done center");
    d.innerHTML = "<b>\u2b50 Bravo \u2b50</b>";
    host.appendChild(d);
    var r = el("div","row");
    r.style.justifyContent = "center";
    var b = el("button","act big","Suite");
    b.addEventListener("click", nextAtelier);
    r.appendChild(b); host.appendChild(r);
    b.scrollIntoView({behavior:"smooth", block:"nearest"});
  }

  /* ---------- 1. avant / apres ---------- */
  function avantApres(host, done){
    host.appendChild(el("h2",null,"Avant et après"));
    host.appendChild(el("p","hint","Touche le nombre qui vient juste avant, et celui qui vient juste après."));
    var card = el("div","card center");
    var line = el("div","line3");
    var before = (N > 0)   ? el("div","numbox q","?") : null;
    var mid    = el("div","numbox now", String(N));
    var after  = (N < 100) ? el("div","numbox q","?") : null;
    if(before) line.appendChild(before);
    line.appendChild(mid);
    if(after) line.appendChild(after);
    card.appendChild(line);

    var goods = [];
    if(before) goods.push(N-1);
    if(after)  goods.push(N+1);
    var need = goods.length, found = 0;

    var opts = goods.slice(), guard = 0;
    while(opts.length < 4 && guard++ < 300){
      var v = Math.max(0, Math.min(100, N + rnd(-6,6)));
      if(v !== N && opts.indexOf(v) === -1) opts.push(v);
    }
    var box = el("div","opts");
    shuffle(opts).forEach(function(v){
      var b = el("button","opt",String(v));
      b.addEventListener("click", function(){
        if(b.disabled) return;
        if(before && v === N-1 && before.classList.contains("q")){
          before.textContent = v; before.classList.remove("q"); before.classList.add("set");
        } else if(after && v === N+1 && after.classList.contains("q")){
          after.textContent = v; after.classList.remove("q"); after.classList.add("set");
        } else {
          b.classList.add("bad"); b.disabled = true; return;
        }
        b.classList.add("good"); b.disabled = true; found++;
        if(found === need){
          [].forEach.call(box.children, function(x){ x.disabled = true; });
          setTimeout(function(){ finish(host); done(); }, 420);
        }
      });
      box.appendChild(b);
    });
    card.appendChild(box);
    host.appendChild(card);
  }

  /* ---------- 2. matériel de numération ---------- */
  function materiel(host, done){
    host.appendChild(el("h2",null,"Matériel de numération"));
    host.appendChild(el("p","hint","Construis " + N + " avec des barres de dix et des cubes."));
    var card = el("div","card");
    var mat = el("div","mat");
    var bars = el("div","bars"), cubes = el("div","cubes");
    mat.appendChild(bars); mat.appendChild(cubes);
    card.appendChild(mat);
    var cnt = el("div","cnt");
    card.appendChild(cnt);
    var ctrls = el("div","ctrls");
    var d = 0, u = 0, locked = false;
    function draw(){
      bars.innerHTML = ""; cubes.innerHTML = "";
      for(var i=0;i<d;i++) bars.appendChild(el("div","barre"));
      for(var j=0;j<u;j++) cubes.appendChild(el("div","cube"));
      cnt.textContent = d + (d>1?" barres":" barre") + " et " + u + (u>1?" cubes":" cube") + " = " + (d*10+u);
      if(!locked && d*10+u === N){
        locked = true;
        cnt.style.color = "var(--ok)";
        [].forEach.call(ctrls.children, function(x){ x.disabled = true; });
        setTimeout(function(){ finish(host); done(); }, 400);
      }
    }
    [["+","barre",function(){ if(d<10) d++; }],
     ["−","barre",function(){ if(d>0) d--; }],
     ["+","cube",function(){ if(u<9) u++; }],
     ["−","cube",function(){ if(u>0) u--; }]].forEach(function(p){
      var b = el("button","icbtn");
      b.appendChild(el("span","sign",p[0]));
      b.appendChild(el("span","mini-"+p[1]));
      b.setAttribute("aria-label", (p[0]==="+"?"Ajouter":"Enlever") + " une " + (p[1]==="barre"?"barre de dix":"unité"));
      b.addEventListener("click", function(){ if(locked) return; p[2](); draw(); });
      ctrls.appendChild(b);
    });
    card.appendChild(ctrls);
    host.appendChild(card);
    draw();
  }

  /* ---------- 3. tableau de numération ---------- */
  function tableau(host, done){
    host.appendChild(el("h2",null,"Tableau de numération"));
    host.appendChild(el("p","hint","Place les chiffres de " + N + " dans les bonnes colonnes."));
    var card = el("div","card");
    var cols = (N >= 100) ? ["c","d","u"] : ["d","u"];
    var want = (N >= 100) ? [Math.floor(N/100), Math.floor(N/10)%10, N%10]
                          : [Math.floor(N/10), N%10];
    var tn = el("div","tn"), vals = [];
    cols.forEach(function(c,i){
      var cc = el("div","tncol");
      cc.appendChild(el("div","tnhead",c));
      var v = el("div","tnval",""); cc.appendChild(v); vals.push(v); tn.appendChild(cc);
    });
    card.appendChild(tn);
    var cur = 0;
    var pad = el("div","pad");
    for(var k=0;k<10;k++){
      (function(k){
        var b = el("button",null,String(k));
        b.addEventListener("click", function(){
          if(cur >= cols.length) return;
          if(k === want[cur]){
            vals[cur].textContent = k; vals[cur].classList.add("set"); cur++;
            if(cur >= cols.length){
              [].forEach.call(pad.children, function(x){ x.disabled = true; });
              setTimeout(function(){ finish(host); done(); }, 450);
            }
          } else {
            b.classList.add("shake");
            setTimeout(function(){ b.classList.remove("shake"); }, 320);
          }
        });
        pad.appendChild(b);
      })(k);
    }
    card.appendChild(pad);
    host.appendChild(card);
  }

  /* ---------- 4. comparer ---------- */
  function comparer(host, done){
    host.appendChild(el("h2",null,"Comparer"));
    host.appendChild(el("p","hint","Plus petit, plus grand, ou pareil ?"));

    // deux relations differentes, compatibles avec N
    var possibles = [];
    if(N < 100) possibles.push("<");
    if(N > 0)   possibles.push(">");
    possibles.push("=");
    var rels = shuffle(possibles).slice(0, 2);

    // deux ordres de symboles differents
    var perms = [], guard = 0;
    perms.push(shuffle(["<", ">", "="]));
    while(guard++ < 50){
      var q = shuffle(["<", ">", "="]);
      if(q.join("") !== perms[0].join("")){ perms.push(q); break; }
    }
    if(perms.length < 2) perms.push(["=", "<", ">"]);

    var items = rels.map(function(rel, i){
      return function(h, next){
        var m;
        if(rel === "=") m = N;
        else if(rel === "<") m = Math.min(100, N + rnd(1, Math.max(1, Math.min(15, 100 - N))));
        else m = Math.max(0, N - rnd(1, Math.max(1, Math.min(15, N))));
        var good = N < m ? "<" : (N > m ? ">" : "=");

        var card = el("div","card center");
        var line = el("div","line3");
        line.appendChild(el("div","numbox", String(N)));
        var sign = el("div","cmp","?");
        line.appendChild(sign);
        line.appendChild(el("div","numbox", String(m)));
        card.appendChild(line);

        var box = el("div","opts");
        perms[i].forEach(function(sym){
          var b = el("button","opt", sym);
          b.addEventListener("click", function(){
            if(card.dataset.lock) return;
            if(sym === good){
              card.dataset.lock = "1";
              b.classList.add("good");
              sign.textContent = sym; sign.style.color = "var(--ok)";
              [].forEach.call(box.children, function(x){ x.disabled = true; });
              setTimeout(next, 450);
            } else { b.classList.add("bad"); b.disabled = true; }
          });
          box.appendChild(b);
        });
        card.appendChild(box);
        h.appendChild(card);
      };
    });
    serie(host, items, function(){ finish(host); done(); });
  }

  /* ---------- 5. ordonner ---------- */
  function ordonner(host, done){
    host.appendChild(el("h2",null,"Ordonner"));
    var asc = Math.random() < 0.5;
    host.appendChild(el("p","hint", asc
      ? "Range les nombres du plus petit au plus grand."
      : "Range les nombres du plus grand au plus petit."));

    var set = [N];
    while(set.length < 4){
      var v = Math.max(0, Math.min(100, N + rnd(-30,30)));
      if(set.indexOf(v) === -1) set.push(v);
    }
    var target = set.slice().sort(function(a,b){ return asc ? a-b : b-a; });

    var card = el("div","card");

    var ends = el("div","ends");
    ends.appendChild(el("span", asc ? "s" : "g", asc ? "le plus petit" : "le plus grand"));
    ends.appendChild(el("span", asc ? "g" : "s", asc ? "le plus grand" : "le plus petit"));
    card.appendChild(ends);

    var sch = el("div","schema"), slots = [];
    for(var i=0;i<4;i++){
      if(i) sch.appendChild(el("div","arrow","\u2192"));
      var sl = el("div","slot",""); slots.push(sl); sch.appendChild(sl);
    }
    card.appendChild(sch);

    var pool = el("div","ordpool");
    var step = 0;
    shuffle(set).forEach(function(v){
      var b = el("button",null,String(v));
      b.addEventListener("click", function(){
        if(b.disabled) return;
        if(v === target[step]){
          b.classList.add("taken"); b.disabled = true;
          slots[step].textContent = v; slots[step].classList.add("set");
          step++;
          if(step === target.length) setTimeout(function(){ finish(host); done(); }, 420);
        } else {
          b.classList.add("shake");
          setTimeout(function(){ b.classList.remove("shake"); }, 320);
        }
      });
      pool.appendChild(b);
    });
    card.appendChild(pool);
    host.appendChild(card);
  }

  /* ---------- 6. composer et decomposer ---------- */
  function composer(host, done){
    host.appendChild(el("h2",null,"Composer et décomposer"));
    host.appendChild(el("p","hint","Touche deux nombres qui font " + N + " ensemble. Il y a 3 paires à trouver."));

    var units = [];
    for(var u = 1; u <= Math.min(9, N); u++) units.push(u);
    if(units.length === 0) units = [0];
    units = shuffle(units);
    var picks = [];
    for(var k = 0; k < 3; k++) picks.push(units[k % units.length]);

    var tiles = [];
    picks.forEach(function(u){ tiles.push(N - u); tiles.push(u); });
    tiles = shuffle(tiles);

    var card = el("div","card center");
    card.appendChild(el("div","q", N + " = ___ + ___"));
    var grid = el("div","pairs");
    var found = el("div","found");
    var sel = null, nb = 0;

    tiles.forEach(function(v){
      var b = el("button",null,String(v));
      b.dataset.v = v;
      b.addEventListener("click", function(){
        if(b.disabled) return;
        if(sel === b){ b.classList.remove("sel"); sel = null; return; }
        if(!sel){ sel = b; b.classList.add("sel"); return; }
        var a = Number(sel.dataset.v), c = Number(b.dataset.v);
        if(a + c === N){
          sel.classList.remove("sel");
          sel.classList.add("taken"); b.classList.add("taken");
          sel.disabled = true; b.disabled = true;
          found.appendChild(el("span", null, a + " + " + c + " = " + N));
          sel = null; nb++;
          if(nb === 3){
            setTimeout(function(){ finish(host); done(); }, 450);
          }
        } else {
          var first = sel;
          b.classList.add("shake"); first.classList.add("shake");
          setTimeout(function(){
            b.classList.remove("shake");
            first.classList.remove("shake","sel");
          }, 330);
          sel = null;
        }
      });
      grid.appendChild(b);
    });

    card.appendChild(grid);
    card.appendChild(found);
    host.appendChild(card);
  }

  /* ---------- moteur ---------- */
  var ATELIERS = [avantApres, materiel, tableau, comparer, ordonner, composer];

  function drawDots(){
    var d = $("#dots"); d.innerHTML = "";
    for(var i=0;i<ORDER.length;i++){
      var x = el("div","dot" + (i < IDX ? " on" : (i === IDX ? " now" : "")));
      d.appendChild(x);
    }
    $("#step").textContent = "Atelier " + Math.min(IDX+1, ORDER.length) + " / " + ORDER.length;
  }

  function nextAtelier(){
    IDX++;
    if(IDX >= ORDER.length){
      $("#play").hidden = true;
      $("#end").hidden = false;
      $("#stars").textContent = "🦄🦄🦄🦄🦄🦄";
      window.scrollTo(0,0);
      return;
    }
    render();
  }

  function render(){
    drawDots();
    var host = $("#atelier"); host.innerHTML = "";
    ORDER[IDX](host, function(){});
    host.scrollIntoView({behavior:"smooth", block:"nearest"});
  }

  function start(){
    N = rnd(0,100);
    ORDER = shuffle(ATELIERS);
    IDX = 0;
    $("#bigN").textContent = N;
    $("#start").hidden = true;
    $("#end").hidden = true;
    $("#play").hidden = false;
    render();
    window.scrollTo(0,0);
  }

  $("#go").addEventListener("click", start);
  $("#again").addEventListener("click", start);
})();
</script>
